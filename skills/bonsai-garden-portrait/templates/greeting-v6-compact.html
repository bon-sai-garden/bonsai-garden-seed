<!--
  Bonsai Garden greeting card, compact (routines 2.5 Step 2d): the greeting of every kin.
  The gardener, 2026-10-13: "make the intro less context-expensive ... compact greeting routine".
  The gardener, 2026-10-21: "now that we are public I would like to bring back the visual intro".
  The face is a link, never base64: an image from the public crew repo through cdn.jsdelivr.net, the one image
  origin the widget sandbox lets through, pinned to a commit in the garden's agents/faces.json. No script: the
  kin's kanji seal (white on the canonical colour) sits under the face and shows whenever the face does not
  load, so a missing image is never a broken frame. The face is a CSS background, not an <img>: a background
  that fails paints nothing, where Chromium draws a broken-image glyph over the seal even with alt="" (seen
  2026-10-21). Over Remote Control no image loads at all (the gardener, 2026-10-21: "the portrait does not show in
  remote control"): there the seal is what the reader sees, and below 440 px the status column folds into a row
  under the face. Kanji are white, black, canonical or amber, never grey.
  Integrity is said only when it fails (the gardener, 2026-10-21: "never mention it when all is fine"): all
  checks passed, the card carries nothing about them; otherwise __LOUD__ is one line in garden amber at the top.
  A quiet card means every check that ran passed, and alive is not yet a check (not asked until the handshake exists).
  Filled whole by scripts/fill-greeting.py (a placeholder left is an error); the kin passes the fragment to the
  widget tool as it is. The animated v6 stays available: fill-greeting.py --full. id: 01M4T6RC34BNEXHQ7GB2S6D9ER
-->
